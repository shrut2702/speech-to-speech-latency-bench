# Path 2: ASR still batch, but the LLM streams tokens and TTS starts on the
# first sentence while the model writes the next one. Usually the single
# biggest win available, and it costs no quality.
name: cascade_stream_gen
system: cascade
path: stream_gen

manifest: data/manifest.jsonl
clips_dir: data/clips
trials: 4
frame_ms: 20
# The mic keeps running while the user waits for an answer. Full-duplex models
# need these frames to keep generating; the cascade ignores them. Systems end
# the stream early by breaking out of their loop, so this is an upper bound,
# not a cost paid on every trial.
silence_after_s: 20.0
output_sample_rate: 24000

asr:
  backend: faster-whisper
  model: large-v3-turbo
  compute_type: float16

llm:
  backend: vllm
  model: Qwen/Qwen3-4B-Instruct
  temperature: 0.0
  seed: 0
  max_tokens: 96
  system_prompt: "Answer in at most two sentences."

tts:
  family: ar
  backend: cosyvoice2
  # AR: stream acoustic tokens, decode incrementally.
  # NAR: no tokens to stream, so chunk on sentence boundaries instead.
  chunk_on: sentence
