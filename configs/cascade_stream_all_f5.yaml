# Path 3: ASR also runs while the user is still speaking, so when the endpoint
# arrives only a short finalize remains. Does not make the LLM start earlier in
# wall-clock terms; it moves ASR's compute to before t=0 so it stops counting.
name: cascade_stream_all_f5
system: cascade
path: stream_all

manifest: data/manifest.jsonl
clips_dir: data/clips
trials: 4
frame_ms: 20
# The mic keeps running while the user waits for an answer. Full-duplex models
# need these frames to keep generating; the cascade ignores them. Systems end
# the stream early by breaking out of their loop, so this is an upper bound,
# not a cost paid on every trial.
silence_after_s: 20.0
output_sample_rate: 24000

# One container, several GPUs, one process. Stages are objects on separate
# devices rather than services behind a socket: a benchmark is a job, not a
# production deployment, and a network hop between stages would land inside the
# number being measured.
#
# A card index per stage, not a torch device string: the worker exports it as
# CUDA_VISIBLE_DEVICES before torch is imported, so each process sees one card
# and calls it cuda:0. Placement is recorded into every trace, so a one-GPU run
# and a three-GPU run can never be compared by accident.
devices:
  llm: 0
  asr: 1
  tts: 2

asr:
  backend: whisper-streaming
  model: large-v3-turbo
  compute_type: float16
  # Same weights as the batch configs on purpose. Only the streaming policy
  # differs, so the measured difference is attributable to it.
  policy: local-agreement

llm:
  backend: vllm
  model: Qwen/Qwen3-4B-Instruct-2507
  # Pinned so every config does identical work. If these drift, the comparison
  # is void and scripts/report.py will say so.
  temperature: 0.0
  seed: 0
  max_tokens: 96
  # Two constraints, both load-bearing. The length cap keeps TTS work constant
  # across configs. The plain-text rule exists because the answer is going to be
  # spoken: left alone the model emits LaTeX and markdown on the maths clips,
  # which no TTS can say, and which crashed CosyVoice's text normalizer.
  system_prompt: "Answer in at most two sentences. Reply in plain spoken English with no markdown, LaTeX, equations or symbols."

tts:
  # Zero-shot needs a reference voice and its transcript, fixed across every
  # trial: a different speaker means different durations and so different TTS
  # work. This one is wildvoice bc81b9bf from VoiceBench, English, 5.0s.
  prompt_wav: assets/prompt.wav
  prompt_text: "Can you do a script about Shawn Elliott vs. Clemson State?"
  family: nar
  backend: f5
  # Flow matching. Nothing to stream: the solver has to finish a chunk before
  # any of it exists, so the first chunk's size sets time to first audio
  # outright. This is the asymmetry the grid exists to expose, not a defect.
  chunk_on: sentence
  # Uneven on purpose. A small first chunk buys a low time to first audio;
  # everything after it hides inside the playback of the chunk before, so it can
  # be long enough to sound right. Worth sweeping, and it matters more for the
  # NAR family, which has no token streaming to fall back on.
  first_chunk_words: 8
  # Punctuation below this is ignored, so a sentence that ends two words
  # in is absorbed instead of becoming its own clipped chunk.
  min_chunk_words: 6
  max_chunk_words: 40
